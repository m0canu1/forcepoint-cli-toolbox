name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for script in dist/*.sh; do
            [ -f "$script" ] || continue
            found=1
            echo "Checking syntax: $script"
            bash -n "$script"
          done
          [ "$found" -eq 1 ] || { echo 'No dist scripts found.' >&2; exit 1; }

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          for script in dist/*.sh; do
            [ -f "$script" ] || continue
            echo "ShellCheck: $script"
            shellcheck -S error "$script"
          done

      - name: Public-safety checks
        run: bash .github/scripts/check-public-safety.sh
