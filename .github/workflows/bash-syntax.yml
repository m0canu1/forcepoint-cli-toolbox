name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck busybox

      - name: Validate Bash syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done < <(find scripts dist -type f -name '*.sh' -print0)

      - name: ShellCheck
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' script; do
            echo "ShellCheck: $script"
            shellcheck -S error -x "$script"
          done < <(find scripts dist -type f -name '*.sh' -print0)

      - name: Verify standalone distribution
        run: bash scripts/build-dist.sh --check

      - name: Public-safety checks
        run: bash scripts/ci/check-public-safety.sh
